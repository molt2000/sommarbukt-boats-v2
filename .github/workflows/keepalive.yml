name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 * * 0" # Every Sunday at 06:00 UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlueHd4and6bHprZGVjcGhudXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTYyNzAsImV4cCI6MjA5NjEzMjI3MH0.s6-0i56z_nX5KaBdnPpaPfFcWR4hFArrUAWB2ZkhOfo
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ynxwxjwzlzkdecphnutv.supabase.co/rest/v1/boats?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status code: $STATUS"
            exit 1
          fi
